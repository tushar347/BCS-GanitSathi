name: Lint & Contracts Validation

on:
  push:
    branches: [ main, "feat/**" ]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**.md"
      - ".gitignore"
      - "commit_msg.txt"
      - "LICENSE"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**.md"
      - ".gitignore"
      - "commit_msg.txt"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pyyaml sympy
      - name: Validate Pydantic Schemas & Prompt Contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          import json, yaml
          from src.controller.schemas import Observation
          with open('configs/thresholds.yaml') as f:
              yaml.safe_load(f)
          with open('configs/prompt_contracts/extractor_contract.json') as f:
              json.load(f)
          with open('configs/prompt_contracts/realizer_contract.json') as f:
              json.load(f)
          print('All schemas and contracts valid.')
          "
